<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title description">
  <title id="title">Use SEO Framework with your SPA on cPanel PHP hosting</title>
  <desc id="description">Build your React, Vite-powered or other single-page app. Add SEO Framework with a clean template, public page configuration and optional JSON adapters. Deploy the complete package to cPanel or another PHP host. PHP returns readable page content, canonical links and JSON-LD before JavaScript takes over the interactive app.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="#56856b" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
      .ink { fill: #20382e; }
      .muted { fill: #64776a; }
      .green { fill: #126b55; }
      .white { fill: #fff; }
      .mono { font-family: Consolas, 'Liberation Mono', monospace; }
      .small { font-size: 22px; }
      .detail { font-size: 24px; }
      .card-title { font-size: 31px; font-weight: 700; letter-spacing: -.7px; }
    </style>
  </defs>

  <path fill="#f7faf5" d="M0 0h1600v960H0z"/>
  <path fill="#edf4e9" d="M1300 0h300v250c-100-20-200-100-300-250Z"/>
  <rect x="64" y="45" width="44" height="44" rx="12" fill="#126b55"/>
  <path d="m80 58-9 9 9 9m12-18 9 9-9 9m-5-21-5 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="124" y="76" class="ink" font-size="29" font-weight="750" letter-spacing="-.7">SEO Framework</text>
  <rect x="1245" y="48" width="291" height="40" rx="20" fill="#e7f0e1" stroke="#d9e5d2"/>
  <circle cx="1269" cy="68" r="5" fill="#458557"/>
  <text x="1284" y="75" class="green" font-size="20" font-weight="600">No Node.js server needed</text>

  <text x="64" y="166" class="ink" font-size="62" font-weight="750" letter-spacing="-2.4">Your SPA, ready to be found.</text>
  <text x="64" y="215" class="muted" font-size="28">Keep your frontend. Add crawlable HTML. Host it on cPanel.</text>

  <!-- Step 1: the user's existing frontend build. -->
  <rect x="64" y="270" width="448" height="354" rx="20" fill="#fff" stroke="#dce6d6" stroke-width="2"/>
  <rect x="91" y="297" width="39" height="29" rx="7" fill="#edf4e7"/>
  <text x="110.5" y="318" class="green mono" font-size="18" text-anchor="middle">01</text>
  <text x="145" y="320" class="ink card-title">Build your SPA</text>
  <text x="93" y="359" class="muted detail">React, Vite-powered apps &amp; more</text>
  <rect x="93" y="388" width="390" height="154" rx="11" fill="#f8faf5" stroke="#dfe8d8" stroke-width="2"/>
  <path d="M94 424h388" stroke="#dfe8d8" stroke-width="2"/>
  <circle cx="111" cy="406" r="4" fill="#bacbb1"/>
  <circle cx="126" cy="406" r="4" fill="#bacbb1"/>
  <circle cx="141" cy="406" r="4" fill="#bacbb1"/>
  <text x="166" y="413" class="muted mono" font-size="18">your-app / dist</text>
  <path d="m129 452-13 12 13 12m28-24 13 12-13 12m-10-28-8 32" fill="none" stroke="#43866b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="190" y="446" width="179" height="8" rx="4" fill="#c9d9bd"/>
  <rect x="190" y="465" width="248" height="8" rx="4" fill="#e1e9d9"/>
  <rect x="190" y="484" width="204" height="8" rx="4" fill="#e1e9d9"/>
  <rect x="116" y="509" width="99" height="5" rx="2.5" fill="#c9d9bd"/>
  <rect x="227" y="509" width="93" height="5" rx="2.5" fill="#e1e9d9"/>
  <text x="93" y="588" class="ink detail" font-weight="550">Your existing HTML, CSS &amp; JS</text>

  <path d="M528 446h31" fill="none" stroke="#56856b" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- Step 2: package the build with framework resources. -->
  <rect x="576" y="270" width="448" height="354" rx="20" fill="#126b55"/>
  <rect x="603" y="297" width="39" height="29" rx="7" fill="#2b8068"/>
  <text x="622.5" y="318" class="white mono" font-size="18" text-anchor="middle">02</text>
  <text x="657" y="320" class="white card-title">Add SEO Framework</text>
  <text x="605" y="359" fill="#c6e5d4" class="detail">Package your build with PHP</text>
  <rect x="605" y="388" width="390" height="154" rx="11" fill="#0d5946" stroke="#398b70" stroke-width="1.5"/>
  <g fill="none" stroke="#9bd0b4" stroke-width="2" stroke-linejoin="round">
    <path d="M626 408h15l7 7v21h-22Zm15 0v7h7"/>
    <path d="M626 451h15l7 7v21h-22Zm15 0v7h7"/>
    <path d="M626 494h15l7 7v21h-22Zm15 0v7h7"/>
  </g>
  <text x="667" y="430" fill="#edf9ef" class="mono small">site.php</text>
  <text x="667" y="473" fill="#edf9ef" class="mono small">clean HTML template</text>
  <text x="667" y="516" fill="#edf9ef" class="mono small">optional JSON adapters</text>
  <text x="605" y="588" class="white detail" font-weight="550">One self-contained deployment</text>

  <path d="M1040 446h31" fill="none" stroke="#56856b" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- Step 3: upload the complete deployment directory. -->
  <rect x="1088" y="270" width="448" height="354" rx="20" fill="#fff" stroke="#dce6d6" stroke-width="2"/>
  <rect x="1115" y="297" width="39" height="29" rx="7" fill="#edf4e7"/>
  <text x="1134.5" y="318" class="green mono" font-size="18" text-anchor="middle">03</text>
  <text x="1169" y="320" class="ink card-title">Deploy to cPanel</text>
  <text x="1117" y="359" class="muted detail">Or another PHP-capable host</text>
  <rect x="1117" y="388" width="390" height="154" rx="11" fill="#f8faf5" stroke="#dfe8d8" stroke-width="2"/>
  <rect x="1138" y="408" width="94" height="37" rx="7" fill="#edf3e6" stroke="#ccdbbf" stroke-width="1.5"/>
  <rect x="1138" y="452" width="94" height="37" rx="7" fill="#edf3e6" stroke="#ccdbbf" stroke-width="1.5"/>
  <rect x="1138" y="496" width="94" height="26" rx="6" fill="#edf3e6" stroke="#ccdbbf" stroke-width="1.5"/>
  <circle cx="1154" cy="427" r="4" fill="#5d956a"/>
  <circle cx="1154" cy="471" r="4" fill="#5d956a"/>
  <circle cx="1154" cy="509" r="4" fill="#5d956a"/>
  <path d="M1171 427h43m-43 44h43m-43 38h43" stroke="#b4caa5" stroke-width="3" stroke-linecap="round"/>
  <text x="1253" y="433" class="green mono small">seo.php</text>
  <text x="1253" y="476" class="green mono small">.seo/ + assets/</text>
  <text x="1253" y="519" class="green mono small">.htaccess</text>
  <text x="1117" y="588" class="ink detail" font-weight="550">PHP 8.1+ · Apache / LiteSpeed</text>

  <!-- Runtime behavior after deployment. -->
  <rect x="64" y="665" width="1472" height="214" rx="20" fill="#eef4e8" stroke="#dce7d2" stroke-width="2"/>
  <text x="94" y="707" class="green" font-size="19" font-weight="700" letter-spacing="1.3">WHEN SOMEONE OPENS A PUBLIC ROUTE</text>
  <rect x="94" y="737" width="294" height="100" rx="12" fill="#fff" stroke="#d8e4cd" stroke-width="1.5"/>
  <text x="113" y="775" class="green mono detail" font-weight="600">GET /en/about</text>
  <text x="113" y="809" class="muted" font-size="21">Visitor or search crawler</text>
  <path d="M407 787h46" fill="none" stroke="#56856b" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="483" y="775" class="ink" font-size="29" font-weight="650" letter-spacing="-.5">PHP sends meaningful HTML</text>
  <text x="483" y="813" class="muted" font-size="23">Page content · canonical URLs · JSON-LD</text>
  <path d="M998 787h46" fill="none" stroke="#56856b" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="1072" y="775" class="ink" font-size="28" font-weight="650" letter-spacing="-.4">Your SPA takes over</text>
  <text x="1072" y="813" class="muted" font-size="23">JavaScript adds interaction</text>

  <text x="64" y="926" class="muted" font-size="21">Readable first responses. Localized pages. Automatic sitemap.</text>
  <text x="1536" y="926" class="green" font-size="21" font-weight="600" text-anchor="end">Free &amp; open source · MIT License</text>
</svg>
